services:
  db:
    image: postgres:16-alpine
    container_name: finpilot-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finpilot
      POSTGRES_USER: finpilot_user
      POSTGRES_PASSWORD: finpilot_secure_password_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpilot_user -d finpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: finpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finpilot-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://finpilot_user:finpilot_secure_password_dev@db:5432/finpilot
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=True
      - ENVIRONMENT=production
      - SECRET_KEY=production-secret-key-replace-me-securely
      - DEFAULT_LLM_PROVIDER=fallback
      - PRIMARY_MARKET_DATA_PROVIDER=mock
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: finpilot-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
